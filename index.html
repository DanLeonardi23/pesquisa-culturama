<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesquisa Culturama</title>
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="shortcut icon" href="culturama-favico.png" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fjalla+One&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
   <main>
      <header>
        <img src="IMG/logo-culturama.png" alt="logo Culturama">
        <h1>Pesquisa de opinião</h1>
      </header>
    <section>
        <!-- DADOS PESSOAIS -->
    <form action="" method="get">
            <fieldset>
                <legend>Dados Pessoais</legend>
                <label for="userName">Nome:</label>
                <input id="userName" type="text" name="userName" required>
                <br><br>
                <label for="userAge">Idade:</label>
                <input id="userAge" type="number" name="userAge" min="10" max="120" required>
                <br><br>
                <label for="birthDate">Data de Nascimento:</label>
                <input id="birthDate" type="date" name="birthDate">
                <br><br>
                <label for="userMail">  Email:</label>
                <input id="userMail" type="email" name="userMail" required>
                <br><br>
                <label for="userPhoneNumber">Telefone:</label>
                <input id="userPhoneNumber" type="tel" name="userPhoneNumber" pattern="[0-9]{11}" placeholder="DDD+Num">
                <br><br>
                <label for="userImage">Upload de foto:</label>
                <input id="userImage" type="file" accept="image/*" name="userImage">
                <br><br>
            </fieldset>

            <fieldset> 
                <legend>Perfil</legend>
                <p>Gênero:</p>

                <input id="userGenderF" type="radio" name="userGender" value="Feminino">
                <label for="userGenderF">Feminino</label> 

                <input id="userGenderM" type="radio" name="userGender" value="Masculino">
                <label for="userGenderM">Masculino</label>

                <input id="userGenderNI" type="radio" name="userGender" value="notInformed">
                <label for="userGenderNI">Não Informado</label>
                <br><br>

                <label for="maritalStatus">Estado Civil:</label>
                <select name="maritalStatus" required>
                    <option value="notInformed">Selecione...</option>
                    <option value="casado">Casado</option>
                    <option value="solteiro">Solteiro</option>
                    <option value="divorciado">Divorciado</option>
                    <option value="viuvo">Viúvo</option>
                    <option value="união">União Estável</option>
                </select>
                <br><br>

                <label for="userState">Estado:</label>
                <select name="userState" required>
                    <option value="notInformed">Selecione...</option>
                    <option value="AC">Acre</option>
                    <option value="AL">Alagoas</option>
                    <option value="AP">Amapá</option>
                    <option value="AM">Amazonas</option>
                    <option value="BA">Bahia</option>
                    <option value="CE">Ceará</option>
                    <option value="DF">Distrito Federal</option>
                    <option value="ES">Espírito Santo</option>
                    <option value="GO">Goiás</option>
                    <option value="MA">Maranhão</option>
                    <option value="MT">Mato Grosso</option>
                    <option value="MS">Mato Grosso do Sul</option>
                    <option value="MG">Minas Gerais</option>
                    <option value="PA">Pará</option>
                    <option value="PB">Paraíba</option>
                    <option value="PR">Paraná</option>
                    <option value="PE">Pernambuco</option>
                    <option value="PI">Piauí</option>
                    <option value="RJ">Rio de Janeiro</option>
                    <option value="RN">Rio Grande do Norte</option>
                    <option value="RS">Rio Grande do Sul</option>
                    <option value="RO">Rondônia</option>
                    <option value="RR">Roraima</option>
                    <option value="SC">Santa Catarina</option>
                    <option value="SP">São Paulo</option>
                    <option value="SE">Sergipe</option>
                    <option value="TO">Tocantins</option>
                </select>
                <br><br>

                <label for="userCity">Cidade:</label>
                <input id="userCity" type="text" name="userCity" required>

            </fieldset>

            <fieldset>
                <legend>Hábitos</legend>
                <p>Redes Sociais</p>
                <input id="instagram" type="checkbox" name="social" value="instagram">
                <label for="instagram">Instagram</label>
                <br>
                <input id="facebook" type="checkbox" name="social" value="facebook">
                <label for="facebook">Facebook</label>
                <br>
                <input id="linkedin" type="checkbox" name="social" value="linkedin">
                <label for="linkedin">LinkedIn</label>
                <br>
                <input id="X" type="checkbox" name="social" value="x">
                <label for="X">X (Twitter)</label>
                <br><br>

                <label for="musicStyle">Estilo Musical:</label>
                <input list="styleTypes" id="musicStyle" type="text" name="musicStyle">
                <datalist id="styleTypes">
                    <option value="Pop">
                    <option value="Rock">
                    <option value="Sertanejo">
                    <option value="Funk">
                    <option value="Clássica">
                    <option value="Jazz">
                    <option value="Eletrônica">
                </datalist>
                <br><br>
                <label for="color">Cor Favorita:</label>
                <input type="color" name="userFavoriteColor" id="userFavoriteColor">
                <br><br>
            </fieldset>

             <fieldset> 
                <legend>Opinião</legend>
                <p>O que você acha da qualidade do nosso serviço?</p>

                <input id="userOpinionExcellent" type="radio" name="userOpinion" value="Ótima">
                <label for="userOpinionExcellent">Ótima</label> 

                <input id="userOpinionGood" type="radio" name="userOpinion" value="Boa">
                <label for="userOpinionGood">Boa</label>
                <input id="userOpinionRegular" type="radio" name="userOpinion" value="Regular">
                <label for="userOpinionRegular">Regular</label>
                <input id="userOpinionBad" type="radio" name="userOpinion" value="Ruim">
                <label for="userOpinionBad">Ruim</label>
                <br><br>

                <label for="suggestions">Sugestões:</label>
                <br>
                <textarea id="suggestions" name="suggestions" placeholder="Digite aqui a sua opinião" rows="4" cols="50"></textarea>
            </fieldset>

            <fieldset>
                <legend>Confirmações</legend>
                <input id="userLgpdTerm" type="checkbox" name="userLgpd" value="accepted" required>
                <label for="userLgpdTerm">Eu aceito participar da pesquisa.</label>
                <br>
                <input id="getResult" type="checkbox" name="userGetResults" value="accepted">
                <label for="getResult">Desejo receber o resultado da pesquisa por e-mail.</label>
            </fieldset>
            

            
            
            <button type="submit">Enviar</button>
            <button type="reset">Limpar</button>
        </form>
    </section>

    </main>
 


    
</body>
</html>
